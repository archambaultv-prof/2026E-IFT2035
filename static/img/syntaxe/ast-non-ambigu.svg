<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350">
  <!--
    Unambiguous parse tree for  1 + 2 * 3
    Grammar:  <expr> ::= <expr> + <terme> | <terme>
              <terme> ::= <terme> * <facteur> | <facteur>
              <facteur> ::= ( <expr> ) | nombre
    Colour key:  green = <expr>   blue = <terme>   brown = <facteur>
  -->

  <!-- ── EDGES ── -->
  <!-- L0 root <expr> → L1 -->
  <line x1="320" y1="38"  x2="70"  y2="70"  stroke="#555" stroke-width="1.5"/>
  <line x1="320" y1="38"  x2="220" y2="70"  stroke="#555" stroke-width="1.5"/>
  <line x1="320" y1="38"  x2="450" y2="70"  stroke="#555" stroke-width="1.5"/>
  <!-- L1 left <expr> → L2 <terme> -->
  <line x1="70"  y1="98"  x2="70"  y2="130" stroke="#555" stroke-width="1.5"/>
  <!-- L1 right <terme> → L2 -->
  <line x1="450" y1="98"  x2="330" y2="130" stroke="#555" stroke-width="1.5"/>
  <line x1="450" y1="98"  x2="450" y2="130" stroke="#555" stroke-width="1.5"/>
  <line x1="450" y1="98"  x2="570" y2="130" stroke="#555" stroke-width="1.5"/>
  <!-- L2 left <terme> → L3 <facteur> -->
  <line x1="70"  y1="158" x2="70"  y2="190" stroke="#555" stroke-width="1.5"/>
  <!-- L2 right-left <terme> → L3 <facteur> -->
  <line x1="330" y1="158" x2="330" y2="190" stroke="#555" stroke-width="1.5"/>
  <!-- L2 right <facteur> → L3 nombre -->
  <line x1="570" y1="158" x2="570" y2="190" stroke="#555" stroke-width="1.5"/>
  <!-- L3 left <facteur> → L4 nombre -->
  <line x1="70"  y1="218" x2="70"  y2="250" stroke="#555" stroke-width="1.5"/>
  <!-- L3 right-left <facteur> → L4 nombre -->
  <line x1="330" y1="218" x2="330" y2="250" stroke="#555" stroke-width="1.5"/>
  <!-- L3 right-right nombre → L4 leaf 3 -->
  <line x1="570" y1="218" x2="570" y2="250" stroke="#555" stroke-width="1.5"/>
  <!-- L4 left nombre → L5 leaf 1 -->
  <line x1="70"  y1="278" x2="70"  y2="310" stroke="#555" stroke-width="1.5"/>
  <!-- L4 right-left nombre → L5 leaf 2 -->
  <line x1="330" y1="278" x2="330" y2="310" stroke="#555" stroke-width="1.5"/>

  <!-- ── NODES ── -->

  <!-- L0: root <expr>  (green) -->
  <rect x="275" y="10"  width="90" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="320" y="29"  text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>

  <!-- L1: <expr>, +, <terme> -->
  <rect x="25"  y="70"  width="90" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="70"  y="89"  text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>
  <rect x="195" y="70"  width="50" height="28" rx="5" fill="#888"    stroke="#444"    stroke-width="1.5"/>
  <text x="220" y="89"  text-anchor="middle" font-family="monospace" font-size="16" fill="white">+</text>
  <rect x="405" y="70"  width="90" height="28" rx="5" fill="#1a5a8a" stroke="#123a5a" stroke-width="1.5"/>
  <text x="450" y="89"  text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;terme&gt;</text>

  <!-- L2: <terme>, <terme>, *, <facteur> -->
  <rect x="25"  y="130" width="90" height="28" rx="5" fill="#1a5a8a" stroke="#123a5a" stroke-width="1.5"/>
  <text x="70"  y="149" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;terme&gt;</text>
  <rect x="285" y="130" width="90" height="28" rx="5" fill="#1a5a8a" stroke="#123a5a" stroke-width="1.5"/>
  <text x="330" y="149" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;terme&gt;</text>
  <rect x="425" y="130" width="50" height="28" rx="5" fill="#888"    stroke="#444"    stroke-width="1.5"/>
  <text x="450" y="149" text-anchor="middle" font-family="monospace" font-size="16" fill="white">*</text>
  <rect x="525" y="130" width="90" height="28" rx="5" fill="#8a4a1a" stroke="#5a2a00" stroke-width="1.5"/>
  <text x="570" y="149" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;facteur&gt;</text>

  <!-- L3: <facteur>, <facteur>, nombre -->
  <rect x="25"  y="190" width="90" height="28" rx="5" fill="#8a4a1a" stroke="#5a2a00" stroke-width="1.5"/>
  <text x="70"  y="209" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;facteur&gt;</text>
  <rect x="285" y="190" width="90" height="28" rx="5" fill="#8a4a1a" stroke="#5a2a00" stroke-width="1.5"/>
  <text x="330" y="209" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;facteur&gt;</text>
  <rect x="530" y="190" width="80" height="28" rx="5" fill="#4a7b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="570" y="209" text-anchor="middle" font-family="monospace" font-size="13" fill="white">nombre</text>

  <!-- L4: nombre, nombre, leaf 3 -->
  <rect x="30"  y="250" width="80" height="28" rx="5" fill="#4a7b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="70"  y="269" text-anchor="middle" font-family="monospace" font-size="13" fill="white">nombre</text>
  <rect x="290" y="250" width="80" height="28" rx="5" fill="#4a7b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="330" y="269" text-anchor="middle" font-family="monospace" font-size="13" fill="white">nombre</text>
  <rect x="545" y="250" width="50" height="28" rx="5" fill="#4a9b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="570" y="269" text-anchor="middle" font-family="monospace" font-size="15" fill="white">3</text>

  <!-- L5: leaf 1, leaf 2 -->
  <rect x="45"  y="310" width="50" height="28" rx="5" fill="#4a9b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="70"  y="329" text-anchor="middle" font-family="monospace" font-size="15" fill="white">1</text>
  <rect x="305" y="310" width="50" height="28" rx="5" fill="#4a9b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="330" y="329" text-anchor="middle" font-family="monospace" font-size="15" fill="white">2</text>

  <!-- ── LEGEND ── -->
  <rect x="10"  y="5"  width="12" height="12" rx="2" fill="#2f6b3f"/>
  <text x="26"  y="15" font-family="sans-serif" font-size="11" fill="#333">&lt;expr&gt;</text>
  <rect x="90"  y="5"  width="12" height="12" rx="2" fill="#1a5a8a"/>
  <text x="106" y="15" font-family="sans-serif" font-size="11" fill="#333">&lt;terme&gt;</text>
  <rect x="180" y="5"  width="12" height="12" rx="2" fill="#8a4a1a"/>
  <text x="196" y="15" font-family="sans-serif" font-size="11" fill="#333">&lt;facteur&gt;</text>
</svg>
