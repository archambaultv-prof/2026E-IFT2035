<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <!-- This tree represents (1 + 2) * 3 derived from ambiguous grammar -->
  <!-- Root <expr> at top -->
  <!-- edges -->
  <line x1="200" y1="30" x2="100" y2="90" stroke="#555" stroke-width="1.5"/>
  <line x1="200" y1="30" x2="200" y2="90" stroke="#555" stroke-width="1.5"/>
  <line x1="200" y1="30" x2="310" y2="90" stroke="#555" stroke-width="1.5"/>
  <!-- left <expr> subtree edges -->
  <line x1="100" y1="110" x2="40" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="100" y1="110" x2="100" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="100" y1="110" x2="165" y2="165" stroke="#555" stroke-width="1.5"/>
  <!-- left-left <expr> -> nombre -> 1 -->
  <line x1="40" y1="185" x2="40" y2="235" stroke="#555" stroke-width="1.5"/>
  <line x1="40" y1="255" x2="40" y2="305" stroke="#555" stroke-width="1.5"/>
  <!-- left-right <expr> -> nombre -> 2 -->
  <line x1="165" y1="185" x2="165" y2="235" stroke="#555" stroke-width="1.5"/>
  <line x1="165" y1="255" x2="165" y2="305" stroke="#555" stroke-width="1.5"/>
  <!-- right <expr> -> nombre -> 3 -->
  <line x1="310" y1="110" x2="310" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="310" y1="185" x2="310" y2="235" stroke="#555" stroke-width="1.5"/>

  <!-- root <expr> -->
  <rect x="150" y="10" width="100" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="200" y="29" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>
  <!-- * operator -->
  <rect x="165" y="90" width="70" height="28" rx="5" fill="#888" stroke="#444" stroke-width="1.5"/>
  <text x="200" y="109" text-anchor="middle" font-family="monospace" font-size="16" fill="white">*</text>
  <!-- left <expr> -->
  <rect x="50" y="90" width="100" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="100" y="109" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>
  <!-- right <expr> -->
  <rect x="260" y="90" width="100" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="310" y="109" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>

  <!-- left-left <expr> -->
  <rect x="0" y="165" width="80" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="40" y="184" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>
  <!-- + operator -->
  <rect x="73" y="165" width="55" height="28" rx="5" fill="#888" stroke="#444" stroke-width="1.5"/>
  <text x="100" y="184" text-anchor="middle" font-family="monospace" font-size="16" fill="white">+</text>
  <!-- left-right <expr> -->
  <rect x="118" y="165" width="94" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="165" y="184" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>

  <!-- nombre nodes -->
  <rect x="0" y="235" width="80" height="28" rx="5" fill="#4a7b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="40" y="254" text-anchor="middle" font-family="monospace" font-size="13" fill="white">nombre</text>
  <rect x="118" y="235" width="94" height="28" rx="5" fill="#4a7b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="165" y="254" text-anchor="middle" font-family="monospace" font-size="13" fill="white">nombre</text>
  <rect x="260" y="165" width="100" height="28" rx="5" fill="#4a7b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="310" y="184" text-anchor="middle" font-family="monospace" font-size="13" fill="white">nombre</text>

  <!-- leaf values -->
  <rect x="15" y="305" width="50" height="26" rx="5" fill="#4a9b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="40" y="323" text-anchor="middle" font-family="monospace" font-size="15" fill="white">1</text>
  <rect x="140" y="305" width="50" height="26" rx="5" fill="#4a9b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="165" y="323" text-anchor="middle" font-family="monospace" font-size="15" fill="white">2</text>
  <rect x="285" y="235" width="50" height="26" rx="5" fill="#4a9b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="310" y="253" text-anchor="middle" font-family="monospace" font-size="15" fill="white">3</text>
</svg>
