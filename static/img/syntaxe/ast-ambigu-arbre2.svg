<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <!-- This tree represents 1 + (2 * 3) derived from ambiguous grammar -->
  <!-- edges -->
  <line x1="200" y1="30" x2="90" y2="90" stroke="#555" stroke-width="1.5"/>
  <line x1="200" y1="30" x2="200" y2="90" stroke="#555" stroke-width="1.5"/>
  <line x1="200" y1="30" x2="310" y2="90" stroke="#555" stroke-width="1.5"/>
  <!-- left <expr> -> nombre -> 1 -->
  <line x1="90" y1="110" x2="90" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="90" y1="185" x2="90" y2="235" stroke="#555" stroke-width="1.5"/>
  <!-- right <expr> subtree -->
  <line x1="310" y1="110" x2="240" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="310" y1="110" x2="310" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="310" y1="110" x2="375" y2="165" stroke="#555" stroke-width="1.5"/>
  <!-- right-left <expr> -> nombre -> 2 -->
  <line x1="240" y1="185" x2="240" y2="235" stroke="#555" stroke-width="1.5"/>
  <line x1="240" y1="255" x2="240" y2="305" stroke="#555" stroke-width="1.5"/>
  <!-- right-right <expr> -> nombre -> 3 -->
  <line x1="375" y1="185" x2="375" y2="235" stroke="#555" stroke-width="1.5"/>
  <line x1="375" y1="255" x2="375" y2="305" stroke="#555" stroke-width="1.5"/>

  <!-- root <expr> -->
  <rect x="150" y="10" width="100" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="200" y="29" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>
  <!-- left <expr> -->
  <rect x="40" y="90" width="100" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="90" y="109" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>
  <!-- + operator -->
  <rect x="165" y="90" width="70" height="28" rx="5" fill="#888" stroke="#444" stroke-width="1.5"/>
  <text x="200" y="109" text-anchor="middle" font-family="monospace" font-size="16" fill="white">+</text>
  <!-- right <expr> -->
  <rect x="260" y="90" width="100" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="310" y="109" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>

  <!-- left nombre -->
  <rect x="40" y="165" width="100" height="28" rx="5" fill="#4a7b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="90" y="184" text-anchor="middle" font-family="monospace" font-size="13" fill="white">nombre</text>
  <!-- leaf 1 -->
  <rect x="65" y="235" width="50" height="26" rx="5" fill="#4a9b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="90" y="253" text-anchor="middle" font-family="monospace" font-size="15" fill="white">1</text>

  <!-- right-left <expr> -->
  <rect x="190" y="165" width="100" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="240" y="184" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>
  <!-- * operator -->
  <rect x="285" y="165" width="60" height="28" rx="5" fill="#888" stroke="#444" stroke-width="1.5"/>
  <text x="310" y="184" text-anchor="middle" font-family="monospace" font-size="16" fill="white">*</text>
  <!-- right-right <expr> -->
  <rect x="330" y="165" width="90" height="28" rx="5" fill="#2f6b3f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="375" y="184" text-anchor="middle" font-family="monospace" font-size="13" fill="white">&lt;expr&gt;</text>

  <!-- right-left nombre -->
  <rect x="190" y="235" width="100" height="28" rx="5" fill="#4a7b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="240" y="254" text-anchor="middle" font-family="monospace" font-size="13" fill="white">nombre</text>
  <rect x="215" y="305" width="50" height="26" rx="5" fill="#4a9b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="240" y="323" text-anchor="middle" font-family="monospace" font-size="15" fill="white">2</text>
  <!-- right-right nombre -->
  <rect x="330" y="235" width="90" height="28" rx="5" fill="#4a7b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="375" y="254" text-anchor="middle" font-family="monospace" font-size="13" fill="white">nombre</text>
  <rect x="350" y="305" width="50" height="26" rx="5" fill="#4a9b5f" stroke="#234a2b" stroke-width="1.5"/>
  <text x="375" y="323" text-anchor="middle" font-family="monospace" font-size="15" fill="white">3</text>
</svg>
